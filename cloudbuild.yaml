# Liste des Cloud Builders : https://console.cloud.google.com/gcr/images/cloud-builders/GLOBAL
steps:
  # Étape 1 : Construction de l'image (On garde, mais vérifie le nom de l'image)
  - name: "gcr.io/cloud-builders/docker"
    id: "Building Docker image"
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/purchase-predict-api:$SHORT_SHA', '.']

  # Étape 2 : Envoi de l'image (On garde)
  - name: 'gcr.io/cloud-builders/docker'
    id: "Pushing Docker image"
    args: ['push', 'gcr.io/$PROJECT_ID/purchase-predict-api:$SHORT_SHA']

  # Étape 3 : Remplacement du tag DOCKER_TAG (MODIFICATION MAJEURE)
  # Cette étape fusionne tes YAML et remplace DOCKER_TAG par le SHA du commit
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: "Rendering templated K8s YAML file"
    entrypoint: /bin/sh
    args:
      - '-c'
      - |
         sed -s '$a---' k8s/*.yaml > config.yaml.tpl && \
         sed "s/DOCKER_TAG/${SHORT_SHA}/g" config.yaml.tpl > config.yaml

  # Étape 4 : Déploiement sur GKE (REMPLACE CLOUD RUN)
  - name: 'gcr.io/cloud-builders/kubectl'
    id: "Deploy to K8s"
    args:
      - 'apply'
      - '--namespace'
      - 'api-purchase'
      - '-f'
      - 'config.yaml'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=europe-west2' 
      - 'CLOUDSDK_CONTAINER_CLUSTER=purchase-predict-api-2'

# Timeout et options (Tu peux garder tes options actuelles)
timeout: 1200s

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY 

images:
  - 'gcr.io/$PROJECT_ID/purchase-predict-api:$SHORT_SHA'